<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gantt Mayo 2026 — Rolado / R1</title></head><body><noscript>Este archivo requiere JavaScript para mostrar el Gantt.</noscript><script src="gantt-data/part01.js"></script><script src="gantt-data/part02.js"></script><script src="gantt-data/part03.js"></script><script src="gantt-data/part04.js"></script><script src="gantt-data/part05.js"></script><script src="gantt-data/part06.js"></script><script src="gantt-data/part07.js"></script><script>(async()=>{try{if(!("DecompressionStream" in window))throw new Error("Tu navegador no soporta DecompressionStream. Abre esta página en una versión reciente de Chrome, Edge, Firefox o Safari.");const b=atob(window.__GANTT_B64||""),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const s=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));const t=await new Response(s).text();document.open();document.write(t);document.close();}catch(e){document.body.innerHTML="<pre style='white-space:pre-wrap;font-family:system-ui;padding:24px'>No se pudo cargar el Gantt: "+e.message+"</pre>";}})();</script></body></html>
